name: Test

on:
  push:
    branches: [ "compiler" ]
  pull_request:
    branches: [ "compiler" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install clang
      run: sudo apt update && sudo apt install -y clang llvm

    - name: Build and install (fire)
      run: cd fire && go build && sudo mv fire /usr/bin/fire

    - name: Build and install (flvm)
      run: cd flvm && gcc main.c vm.c -o flvm && sudo mv flvm /usr/bin/flvm

    - name: Build and install (flc)
      run: cd flc && make && sudo mv flc /usr/bin/flc

    - name: Run validation
      run: cd validation && fire validate --target=llvm

    - name: Run validation (bytecode)
      run: cd validation && fire validate --target=bytecode

    - name: Run validation (bytecode flc)
      run: cd validation && fire validate --target=bytecode_flc

    - name: Test build
      run: cd examples/example && fire build && ./main.elf
